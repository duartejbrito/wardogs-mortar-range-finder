<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calculate Wardogs mortar range from two map coordinates.">
  <title>Wardogs Mortar Range Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="masthead">
      <p class="eyebrow">Field calculation tool</p>
      <h1>Wardogs Mortar Range Finder</h1>
      <p class="intro">Enter your position and the target position to calculate a direct firing range.</p>
    </header>

    <form id="range-form" novalidate>
      <section class="coordinate-grid" aria-label="Coordinate inputs">
        <div class="field-card">
          <label for="my-position">A — My position</label>
          <p class="field-hint" id="my-position-hint">Format: <code>x98.43, y113.38</code></p>
          <input id="my-position" name="my-position" type="text" inputmode="decimal" autocomplete="off"
            placeholder="x98.43, y113.38" aria-describedby="my-position-hint my-position-error">
          <p class="error-message" id="my-position-error" role="alert"></p>
        </div>

        <div class="field-card">
          <label for="target-position">B — Target position</label>
          <p class="field-hint" id="target-position-hint">Format: <code>x94.53, y109.03</code></p>
          <input id="target-position" name="target-position" type="text" inputmode="decimal" autocomplete="off"
            placeholder="x94.53, y109.03" aria-describedby="target-position-hint target-position-error">
          <p class="error-message" id="target-position-error" role="alert"></p>
        </div>
      </section>

      <div class="actions">
        <button class="button primary" type="submit">Calculate range</button>
      </div>
    </form>

    <section class="result-panel" aria-labelledby="range-heading" aria-live="polite">
      <p class="eyebrow">Calculated direct range</p>
      <h2 id="range-heading"><span id="range-value">—</span> <span class="range-unit">m</span></h2>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
